[package]
name = "quark"
version = "2.1.0"
edition = "2024"

[dependencies]
dirs = "7.0.0"
# Décodage des artworks servis par Steam et SteamGridDB.
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp"] }
reqwest = { version = "0.13.5", default-features = false, features = ["blocking", "form", "json", "query", "rustls"] }
libc = "0.2"
ring = "0.17"
flate2 = "1.1"
tar = "0.4"
zip = { version = "2", default-features = false, features = ["deflate"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
# Online-Fix sert ses pages en Windows-1251.
encoding_rs = "0.8"
# Configuration Ludusavi : un `config.yaml` existant peut être du YAML commenté,
# pas seulement le JSON que Quark y écrit. `serde_yaml` étant archivé, on prend
# le fork maintenu, d'API identique.
serde_yaml_ng = "0.10"
