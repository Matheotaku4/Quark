[package]
name = "quark-overlay"
version = "0.1.0"
edition = "2021"
description = "D3D11 proxy DLL: Steam-like FPS overlay for Quark"
license = "MIT"

[lib]
crate-type = ["cdylib"]

[dependencies]
windows = { version = "0.59", features = [
  "Win32_Foundation",
  "Win32_Graphics_Gdi",
  "Win32_System_LibraryLoader",
  "Win32_System_Memory",
  "Win32_System_SystemInformation",
  "Win32_System_Threading",
  "Win32_Security",
  "Win32_UI_WindowsAndMessaging",
] }

[profile.release]
panic = "abort"
opt-level = "z"
lto = true
codegen-units = 1
strip = true
