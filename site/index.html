}

  const l=e.target.closest("[data-l]");if(l){lang=l.dataset.l;try{localStorage.setItem("q-lang",lang)}catch(x){}render()}
  const t=e.target.closest("[data-t]");if(t&&t.dataset.t!==tab){tab=t.dataset.t;$("#shot").style.opacity=0;setTimeout(render,180)}
});
$("#copy").addEventListener("click",async()=>{try{await navigator.clipboard.writeText($("#cmd").innerText.replace(/^#.*\n/,""));
  const b=$("#copy");b.textContent=D[lang].copied;setTimeout(()=>b.textContent=D[lang].copy,1600)}catch(e){}});
fetch("https://api.github.com/repos/Matheotaku4/Quark/releases/latest").then(r=>r.ok?r.json():Promise.reject()).then(j=>{
  ver=(j.tag_name||"").replace(/^v/,"");const a=(j.assets||[]).find(x=>/linux-x86_64\.tar\.gz$/.test(x.name));
  if(a)$("#dl").href=a.browser_download_url;$("#ver").textContent=ver?"v"+ver:"";$("#cmd").innerHTML=cmd()}).catch(()=>{});
const io=new IntersectionObserver(es=>es.forEach(e=>{if(e.isIntersecting){e.target.classList.add("in");io.unobserve(e.target)}}),{threshold:.12});
$$(".rv").forEach(e=>io.observe(e));
$("#shot").onload=e=>e.target.style.opacity=1;
const M=["Steam","Epic Games","GOG","Proton","umu-launcher","MangoHud","gamescope","GameMode","Ludusavi","Legendary","gogdl","DirectX 11/12"];
$("#mq").innerHTML=[...M,...M].map(x=>`<span>${x}</span>`).join("");
const bar=$("#bar");addEventListener("scroll",()=>bar.style.transform=`scaleX(${scrollY/(document.documentElement.scrollHeight-innerHeight||1)})`,{passive:true});
const hf=$(".hero .frame"),hp=hf.parentElement;
hp.addEventListener("mousemove",e=>{const r=hf.getBoundingClientRect(),x=(e.clientX-r.left)/r.width-.5,y=(e.clientY-r.top)/r.height-.5;hf.style.transform=`perspective(1200px) rotateY(${x*6}deg) rotateX(${-y*5}deg)`});
hp.addEventListener("mouseleave",()=>hf.style.transform="");
$$(".card").forEach(c=>c.addEventListener("mousemove",e=>{const r=c.getBoundingClientRect();c.style.setProperty("--mx",e.clientX-r.left+"px");c.style.setProperty("--my",e.clientY-r.top+"px")}));
new IntersectionObserver((es,o)=>es.forEach(e=>{if(!e.isIntersecting)return;o.unobserve(e.target);$$(".facts b").forEach(b=>{const n=+b.textContent;let t0;const f=t=>{t0??=t;const p=Math.min((t-t0)/1200,1);b.textContent=Math.round(n*(1-Math.pow(1-p,3)));if(p<1)requestAnimationFrame(f)};b.textContent=0;requestAnimationFrame(f)})}),{threshold:.5}).observe($(".facts"));
render();
</script>
