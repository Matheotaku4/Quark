name: release

# Construit Quark sous Linux et publie une release GitHub à chaque push sur
# main (ou manuellement depuis l'onglet Actions). Le numéro de version vient
# de Cargo.toml : le tag `v<version>` est créé/actualisé automatiquement.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable

      - uses: Swatinem/rust-cache@e9d7b9f1e587218970671bac74e5511ed9506e6a # v2

      - name: Dépendances système Tauri (WebKitGTK, GTK)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential pkg-config libwebkit2gtk-4.1-dev libgtk-3-dev \
            librsvg2-dev libssl-dev libayatana-appindicator3-dev libudev-dev \
            cmake libsodium-dev

      - name: Outil de signature minisign
        run: |
          git clone --depth 1 --branch 0.12 https://github.com/jedisct1/minisign.git "$RUNNER_TEMP/minisign-src"
          test "$(git -C "$RUNNER_TEMP/minisign-src" rev-parse HEAD)" = "b85e15d45ac9eab34e44596fd309f5b07db9545c"
          cmake -S "$RUNNER_TEMP/minisign-src" -B "$RUNNER_TEMP/minisign-build"
          cmake --build "$RUNNER_TEMP/minisign-build" -j2
          sudo install -m755 "$RUNNER_TEMP/minisign-build/minisign" /usr/local/bin/minisign
          minisign -v

      - name: Version
        id: version
        run: |
          value="$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)"
          echo "value=$value" >> "$GITHUB_OUTPUT"
          # Un suffixe (`1.1.0-beta.1`) publie une pré-release : GitHub garde alors
          # la dernière version stable comme « Latest ».
          if [[ "$value" == *-* ]]; then echo "prerelease=true" >> "$GITHUB_OUTPUT"; else echo "prerelease=false" >> "$GITHUB_OUTPUT"; fi

      - name: Compilation
        run: cargo build --release --locked --manifest-path quark-tauri/Cargo.toml

      - name: Paquet
        run: |
          mkdir -p dist/quark
          cp quark-tauri/target/release/quark-tauri dist/quark/quark
          cp README.md dist/quark/
          cp assets/quark.desktop dist/quark/
          cp assets/quark.png dist/quark/
          tar -czf "quark-${{ steps.version.outputs.value }}-linux-x86_64.tar.gz" -C dist quark
          sha256sum "quark-${{ steps.version.outputs.value }}-linux-x86_64.tar.gz" > "quark-${{ steps.version.outputs.value }}-linux-x86_64.tar.gz.sha256"

      - name: Signature minisign
        env:
          MINISIGN_SECRET_KEY: ${{ secrets.MINISIGN_SECRET_KEY }}
        run: |
          if [ -z "$MINISIGN_SECRET_KEY" ]; then
            echo "::error title=Clé minisign absente::Ajoutez le secret MINISIGN_SECRET_KEY (contenu de quark-minisign.key)."
            exit 1
          fi
          printf '%s\n' "$MINISIGN_SECRET_KEY" > "$RUNNER_TEMP/quark-minisign.key"
          chmod 600 "$RUNNER_TEMP/quark-minisign.key"
          printf '\n' | minisign -S -s "$RUNNER_TEMP/quark-minisign.key" \
            -m "quark-${{ steps.version.outputs.value }}-linux-x86_64.tar.gz" \
            -x "quark-${{ steps.version.outputs.value }}-linux-x86_64.tar.gz.minisig"
          rm -f "$RUNNER_TEMP/quark-minisign.key"

      - name: Publication de la release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          tag_name: v${{ steps.version.outputs.value }}
          name: Quark v${{ steps.version.outputs.value }}
          body_path: docs/release-notes.md
          prerelease: ${{ steps.version.outputs.prerelease }}
          fail_on_unmatched_files: true
          files: |
            quark-${{ steps.version.outputs.value }}-linux-x86_64.tar.gz
            quark-${{ steps.version.outputs.value }}-linux-x86_64.tar.gz.sha256
            quark-${{ steps.version.outputs.value }}-linux-x86_64.tar.gz.minisig
