name: pages

# Publie uniquement le site vitrine versionné dans site/. La documentation
# interne de docs/ n'est jamais exposée par ce workflow.
on:
  push:
    branches: [main]
    paths:
      - "site/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Préparer GitHub Pages
        uses: actions/configure-pages@v5
        with:
          # Active Pages en mode GitHub Actions sur un dépôt qui ne l'a jamais
          # fait. Le jeton du workflow dispose de pages:write.
          enablement: true

      - name: Empaqueter le site
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - name: Publier
        id: deployment
        uses: actions/deploy-pages@v4
