name: Rust

on:
  push:
    branches: [ "main", "release/**" ]
  pull_request:
    branches: [ "main", "release/**" ]

env:
  CARGO_TERM_COLOR: always

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
    - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
      with:
        components: clippy, rustfmt
    - name: Format
      run: cargo fmt --check
    - name: Clippy
      run: cargo clippy --all-targets --locked -- -D warnings
    - name: Build
      run: cargo build --locked --verbose
    - name: Run tests
      run: cargo test --locked --verbose
    - name: Audit des dépendances
      run: |
        cargo install cargo-deny --locked
        cargo deny check
    - name: Dépendances système Tauri
      run: |
        sudo apt-get update
        sudo apt-get install -y --no-install-recommends \
          libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev libssl-dev \
          libayatana-appindicator3-dev libudev-dev
    - name: Tauri
      run: |
        cargo fmt --manifest-path quark-tauri/Cargo.toml --check
        cargo clippy --manifest-path quark-tauri/Cargo.toml --all-targets --locked -- -D warnings
        cargo test --manifest-path quark-tauri/Cargo.toml --locked
