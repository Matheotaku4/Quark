version: 2
updates:
  - package-ecosystem: cargo
    directory: "/"
    schedule:
      interval: weekly
    target-branch: release/2.2.0
    groups:
      rust:
        patterns: ["*"]
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    target-branch: release/2.2.0
    groups:
      actions:
        patterns: ["*"]
