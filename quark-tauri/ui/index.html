<!doctype html>
<html lang="fr" data-theme="amoled">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark">
  <title>Quark</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="resize-handles" aria-hidden="true">
    <div class="resize-handle n" data-resize="n"></div>
    <div class="resize-handle s" data-resize="s"></div>
    <div class="resize-handle e" data-resize="e"></div>
    <div class="resize-handle w" data-resize="w"></div>
    <div class="resize-handle ne" data-resize="ne"></div>
    <div class="resize-handle nw" data-resize="nw"></div>
    <div class="resize-handle se" data-resize="se"></div>
    <div class="resize-handle sw" data-resize="sw"></div>
  </div>

  <header class="titlebar" id="titlebar">
    <div class="brand" aria-label="Quark">
      <img class="brand-mark" src="quark.png" alt="">
      <span class="brand-name">Quark</span>
    </div>
    <div class="titlebar-search">
      <span class="search-icon" aria-hidden="true"></span>
      <input id="global-search" type="search" autocomplete="off" spellcheck="false" aria-label="Rechercher">
      <kbd>Ctrl K</kbd>
    </div>
    <div class="titlebar-right">
      <button class="running-pill hidden" id="running-pill" type="button"></button>
      <span class="demo-pill hidden" id="demo-pill"></span>
      <div class="window-controls">
        <button class="win-btn" id="win-min" type="button" aria-label="Réduire"></button>
        <button class="win-btn" id="win-max" type="button" aria-label="Agrandir"></button>
        <button class="win-btn win-close" id="win-close" type="button" aria-label="Fermer"></button>
      </div>
    </div>
  </header>

  <div class="app-shell">
    <nav class="rail" aria-label="Navigation">
      <div class="rail-top">
        <button class="rail-btn active" id="rail-library" type="button" data-view="library" aria-label="Bibliothèque"></button>
        <button class="rail-btn" id="rail-settings" type="button" data-view="settings" aria-label="Paramètres"></button>
      </div>
      <div class="rail-bottom">
        <div class="rail-avatar" title="Quark">Q</div>
      </div>
    </nav>

    <section class="library-pane" id="library-pane" aria-label="Bibliothèque">
      <header class="pane-head">
        <div class="pane-title">
          <h1 id="library-title">Bibliothèque</h1>
          <div class="pane-sub">
            <p id="library-count"></p>
            <div class="sort-field">
              <select id="sort-select" aria-label="Trier"></select>
              <span class="select-chevron" aria-hidden="true"></span>
            </div>
          </div>
        </div>
        <button class="btn btn-primary btn-sm" id="add-game-btn" type="button"></button>
      </header>
      <div class="pane-tools">
        <div class="search-field">
          <span class="search-icon" aria-hidden="true"></span>
          <input id="library-search" type="search" autocomplete="off" spellcheck="false">
        </div>
        <div class="chips" id="status-filters" role="tablist"></div>
      </div>
      <div class="game-list" id="game-list" role="listbox" tabindex="0"></div>
      <div class="list-empty hidden" id="list-empty"></div>
    </section>

    <main class="detail-pane" id="detail-pane" tabindex="-1"></main>
  </div>

  <div class="modal-root" id="modal-root"></div>
  <div class="toasts" id="toasts" aria-live="polite"></div>

  <div class="splash" id="splash">
    <div class="splash-glow"></div>
    <img class="splash-mark" src="quark.png" alt="">
    <div class="splash-name">Quark</div>
    <div class="splash-spinner" aria-hidden="true"></div>
  </div>

  <script src="app.js"></script>
</body>
</html>
