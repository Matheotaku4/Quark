[package]
name = "quark-tauri"
version = "1.8.8"
edition = "2021"
description = "Interface Tauri moderne de Quark"
publish = false

[workspace]

[dependencies]
# Cœur métier partagé, sans dépendance graphique.
quark = { path = ".." }
tauri = { version = "2", features = [] }
tauri-runtime = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"
rfd = "0.15"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
panic = "abort"
