[package]
name = "quark-tauri"
version = "2.2.3"
edition = "2021"
description = "Interface Tauri moderne de Quark"
publish = false

[workspace]

[dependencies]
# Cœur métier partagé, sans dépendance graphique.
quark = { path = ".." }
tauri = "2"
tauri-plugin-global-shortcut = "2"
ksni = { version = "0.3", default-features = false, features = ["blocking", "async-io"] }
tauri-runtime = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"
image = { version = "0.25", default-features = false, features = ["png"] }
rfd = "0.15"
gilrs = "0.11"
x11-dl = "2"
url = "2"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
panic = "abort"
